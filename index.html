<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noktalardan çiçek</title>
<style>
:root{--bg:#0b0710;--sub:#8c7a99;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe9f3;--sub:#6e5a7d}}
:root[data-theme="light"]{--bg:#efe9f3;--sub:#6e5a7d}
:root[data-theme="dark"]{--bg:#0b0710;--sub:#8c7a99}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;font:14px system-ui,sans-serif;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{width:min(100vw,calc(100dvh - 70px));height:min(100vw,calc(100dvh - 70px));background:#000;display:block}
</style>
</head>
<body>
<canvas id="c" width="800" height="800" aria-label="Noktalardan oluşan, büyüyüp açan ve solan bir çiçek"></canvas>
<div>Dokun: baştan başlat</div>
<script>
(function(){
const S=800,W=S,H=S,TS=1,T_END=20;
let seed=5;
function R(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function N(m,s){let u=1-R(),v=R();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v)}
const U=(a,b)=>a+R()*(b-a),cl=(x,a,b)=>x<a?a:x>b?b:x,PI=Math.PI;
function pickW(a,p){let r=R(),c=0;for(let i=0;i<a.length;i++){c+=p[i];if(r<c)return a[i]}return a[a.length-1]}
function pk(pal,g,sp,j){if(sp===undefined)sp=.55;if(j===undefined)j=.07;const i=cl(Math.round(cl(g,0,1)*(pal.length-1)+N(0,sp)),0,pal.length-1),f=1+N(0,j),c=pal[i],r=c[0]*f,y=c[1]*f,b=c[2]*f,l=.3*r+.59*y+.11*b,q=v=>Math.max(0,l+(v-l)*1.4)*1.05;return[q(r),q(y),q(b)]}
const sinc=x=>Math.abs(x)<1e-6?1:Math.sin(x)/x;
const prof=u=>Math.pow(Math.sin(PI*Math.pow(cl(u,0,1),.75)),.85)||0;
const sstep=(x,a,b)=>{const t=cl((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function areaU(){for(;;){const u=R();if(R()<prof(u))return u}}
function sampleV(rim){let v=U(-1,1);if(R()<rim)v=Math.sign(v)*U(.88,1);return v}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
const RADS=[1,1.5,2],rad3=()=>pickW(RADS,[.35,.45,.2]);

const KEYS=[[0,0,0,0,0,0,0],[2,.42,.22,0,0,.25,0],[4,.62,.42,0,0,.5,.35],[6,.8,.68,.5,0,.72,.55],[9,1,1,1,0,1,1],[12,1,1,1,0,1,1],[17,.98,.85,.55,1,.92,0],[20,.98,.85,.55,1,.9,0]];
function state(t){t=cl(t,0,T_END);let i=0;while(i<KEYS.length-2&&t>=KEYS[i+1][0])i++;
 const u=(t-KEYS[i][0])/(KEYS[i+1][0]-KEYS[i][0]),a=KEYS[Math.max(i-1,0)],b=KEYS[i],c=KEYS[i+1],d=KEYS[Math.min(i+2,KEYS.length-1)],o=[];
 for(let k=1;k<7;k++){o.push(cl(.5*(2*b[k]+(c[k]-a[k])*u+(2*a[k]-5*b[k]+4*c[k]-d[k])*u*u+(3*b[k]-a[k]-3*c[k]+d[k])*u*u*u),0,1))}return o}

const SOIL=[[10,18,10],[18,32,14],[28,50,18],[42,70,24],[62,92,32],[26,38,26]],
STEM=[[16,46,22],[34,82,36],[62,120,48]],STEMG=[120,175,80],STEMW=[[120,88,66],[96,66,52],[140,108,76]],
LEAF=[[18,45,25],[30,80,40],[48,115,55],[90,150,70]],LEAFW=[[130,100,70],[104,76,58],[146,116,84]],
RIB=[[160,205,130],[200,230,160]],WILT=[[170,110,40],[135,86,34],[104,70,36],[140,110,60],[110,84,50]],
RIM=[[255,232,140],[255,212,90],[255,190,60]],HI=[[255,246,205],[255,250,228]],GOLD=[[255,214,110],[255,238,170],[255,184,90]],
STAM=[[110,35,8],[165,65,14],[225,125,30],[255,205,85]],STAMW=[[140,112,84],[120,96,72]];
const LAYERS=[
{n:3,ac:.3,ao:1.12,kc:-.5,ko:1.1,L:1,wc:.24,wo:.36,d:2500,off:.2,pal:[[150,60,8],[225,115,18],[255,170,35],[255,205,70],[255,228,125]]},
{n:3,ac:.26,ao:1,kc:-.5,ko:1,L:.93,wc:.22,wo:.33,d:2300,off:1.25,pal:[[140,55,8],[215,105,16],[250,160,30],[255,200,65],[255,224,115]]},
{n:0,ac:.36,ao:.46,kc:-.85,ko:-.05,L:.72,wc:.17,wo:.27,d:760,off:.2,pal:[[255,235,140],[255,210,75],[255,180,45],[245,150,25]]},
{n:0,ac:.22,ao:.32,kc:-.5,ko:-.1,L:.46,wc:.14,wo:.22,d:480,off:.55,pal:[[255,250,210],[255,230,120],[255,200,60]]}];
const LEAFD=[[.06,1,1.35,.45,-.9],[.09,-1,1.3,.4,-.95],[.14,1,1.1,.7,-.8],[.17,-1,1.15,.6,-.85],[.3,1,.85,.9,-.7],[.46,-1,.6,1,-.6],[.6,1,.45,1.05,-.5]];

// splat offsets
const OFFS=[];for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(dx*dx+dy*dy<=9)OFFS.push([dx,dy]);
OFFS.sort((a,b)=>(a[0]*a[0]+a[1]*a[1])-(b[0]*b[0]+b[1]*b[1])||a[0]-b[0]||a[1]-b[1]);
const mk=m=>{const o=[];OFFS.forEach(p=>{if(p[0]*p[0]+p[1]*p[1]<=m+.01)o.push(p[0],p[1])});return o};
const O1=mk(1),O15=mk(2.25),O2=mk(4),O3=mk(9),O0=[0,0];
function sp(buf,x,y,r,g,b,rad){const o=rad>2?O3:rad>1.5?O2:rad>1?O15:rad>.5?O1:O0,xi=Math.round(x),yi=Math.round(y);
 for(let k=0;k<o.length;k+=2){const px=xi+o[k],py=yi+o[k+1];if(px<0||px>=W||py<0||py>=H)continue;const i=(py*W+px)*4;buf[i]=r;buf[i+1]=g;buf[i+2]=b}}

const cx=W/2,y0=H*.8,Ls=H*.38,Lf=H*.27;
const surf=x=>y0-.022*H*Math.exp(-Math.pow((x-cx)/(.2*W),2))-.003*H*Math.sin(x*.045)-.002*H*Math.sin(x*.13+1.3);

// ---- build
const base=new Uint8ClampedArray(W*H*4);for(let y=0;y<H;y++){const f=Math.min(1,y/y0);for(let x=0;x<W;x++){const i=(y*W+x)*4;base[i]=6+8*f;base[i+1]=9+14*f;base[i+2]=16+20*f;base[i+3]=255}}
(function(){
 for(let k=0;k<26000;k++){const x=U(0,W),d=Math.pow(R(),1.5)*.14*H,y=surf(x)+d,depth=d/(.14*H),
  edge=Math.pow(cl(Math.min(x,W-x)/(.2*W),0,1),.8),clump=.5+.5*Math.sin(x*.07+y*.05)*Math.sin(y*.11-x*.03),
  br=.9*Math.pow(1-depth,.8)*edge*(.55+.35*clump+.35*R()),c=pk(SOIL,R(),1);
  sp(base,x,y,c[0]*br,c[1]*br,c[2]*br,pickW([1,1.5,2],[.4,.4,.2]))}
 const PEB=[[58,52,48],[84,74,64],[104,90,76],[46,38,32]];
 for(let k=0;k<170;k++){const x=U(.05*W,.95*W),y=surf(x)+Math.pow(R(),1.3)*.1*H,c=pk(PEB,R(),.7),e=Math.pow(cl(Math.min(x,W-x)/(.2*W),0,1),.8);
  sp(base,x,y,c[0]*e*.55,c[1]*e*.55,c[2]*e*.55,pickW([2,3],[.6,.4]))}
})();
const crumbs=[];for(let k=0;k<520;k++){const x=cx+N(0,.03*H),c=pk(SOIL,U(.3,1),.8);crumbs.push({x:x,y:surf(x)-R()*.006*H,amp:H*.05*Math.pow(R(),2.2),dl:U(0,2.5),c:[c[0]*.5,c[1]*.5,c[2]*.5],rad:pickW([1,1.5,2],[.4,.4,.2])})}

const stemP=[];for(let k=0;k<3600;k++){const s=R();let lat=U(-1,1);if(R()<.18)lat=Math.sign(lat)*U(.85,1);
 let live=pk(STEM,s*.8+R()*.2);if(R()<.12){const f=1+N(0,.08);live=[STEMG[0]*f,STEMG[1]*f,STEMG[2]*f]}
 stemP.push({s:s,lat:lat,live:live,wilt:pk(STEMW,R(),.8),rn:R(),rad:rad3()})}
shuffle(stemP);

const headP=[];LAYERS.forEach(Ly=>{for(let i=0;i<Ly.n;i++){
 const P={th:2*PI*i/Ly.n+Ly.off+N(0,.1),aj:N(0,.06),pj:R(),wj:U(-.5,.5),lj:U(.92,1.08),Ly:Ly};
 for(let k=0;k<Ly.d;k++){const u=areaU(),v=sampleV(.14);let c=pk(Ly.pal,u+N(0,.1));
  if(Math.abs(v)>.86&&R()<.55)c=pk(RIM,R());if(R()<.04)c=pk(HI,R());if(R()<.02&&u<.55)c=pk(GOLD,R());
  headP.push({P:P,u:u,v:v,live:c,wilt:pk(WILT,.4*u+.6*R(),.7),rn:R(),rad:pickW([1,1.5,2],[.3,.45,.25]),sp:prof(u)})}}});
shuffle(headP);

const nf=60,fil=[];for(let i=0;i<nf;i++)fil.push({th:U(0,2*PI),beta:U(.2,.85),ell:U(.3,.55)});
const stamP=[];for(let k=0;k<700;k++){const t=1-Math.pow(R(),1.6);stamP.push({f:fil[Math.floor(R()*nf)],t:t,live:pk(STAM,t,.35),wilt:pk(STAMW,R(),.6),rad:t>.88?2:(R()<.5?1:1.5)})}
shuffle(stamP);

const leafP=[];for(let j=0;j<7;j++)for(let k=0;k<700;k++){const u=areaU();let v=sampleV(.1),rib=R()<.09;if(rib)v=N(0,.03);
 leafP.push({lid:j,u:u,v:v,live:rib?pk(RIB,R()):pk(LEAF,u+N(0,.1)),wilt:pk(LEAFW,R(),.8),rn:R(),rad:rad3()})}
shuffle(leafP);

const halo=[];for(let k=0;k<1800;k++){const r=Math.min(Math.abs(N(0,.55)),1.6);halo.push({a:U(0,2*PI),r:r,b:Math.pow(1-r/1.6,1.5)*.55,fl:R()})}shuffle(halo);
const ring=[];for(let j=0;j<7;j++){const m=j?170:700;for(let k=0;k<m;k++)ring.push({cf:j?.5:0,cj:Math.max(j-1,0),rho:j?.5:1,a:U(0,2*PI),fl:R()})}shuffle(ring);
const spark=[];for(let k=0;k<280;k++)spark.push({a:U(0,2*PI),rho:R(),ph:R(),sp:U(.6,1.4),rad:R()<.7?1:2,hue:R()});
const fall=[];for(let k=0;k<260;k++){const xl=cx+N(0,.12*H);fall.push({r0:R(),ox:N(0,1),oy:N(0,1),xl:xl,yl:surf(xl)-R()*.012*H,ph:U(0,6.28),c:pk(WILT,R(),.8),rad:R()<.5?1.5:2})}

// ---- roots & spirals
const ROOTS=[];
function grow(x,y,ang,dist,dep,len){const stp=2.5,n=Math.floor(len/stp);
 for(let k=0;k<n;k++){ang+=N(0,.2)+(PI/2-ang)*(dep?.01:.03);x+=Math.cos(ang)*stp;y+=Math.sin(ang)*stp;dist+=stp;
  if(y>y0+.125*H||x<20||x>W-20)return;
  const d=dist/(H*.3);
  ROOTS.push({x:x,y:y,d:d,b:dep?.55+.3*R():.9,rad:dep?.5:1});
  if(dep===0)ROOTS.push({x:x+1,y:y,d:d,b:.8,rad:.5});
  if(dep<3&&R()<(dep?.05:.07))grow(x,y,ang+(R()<.5?-1:1)*U(.5,1.2),dist,dep+1,len*U(.3,.55))}}
for(let i=0;i<9;i++)grow(cx+N(0,3),y0+4,PI/2+(i-4)/4*1.2+N(0,.1),0,0,H*U(.11,.17));
const GC=[[255,200,70],[255,170,40],[255,225,130],[255,150,30]];
const WISPS=[];
for(let k=0;k<12;k++){const dir=k%2?-1:1,n=240,pts=[];
 for(let i=0;i<n;i++)pts.push({s:(i+R())/n,j:N(0,1.3),r:R()<.35?1:.5,ph:R()*6.28});
 WISPS.push({t0:1.6+k*.8+U(-.15,.15),dir:dir,ox:dir*U(.8,1.9),oy:U(-1.5,.7),turns:U(1.5,2.4),c:GC[k%4],pts:pts})}

const TEND=[];
for(let j=0;j<4;j++){const dir=j%2?-1:1,pts=[],bud=[];
 for(let k=0;k<170;k++){const white=R()<.18;pts.push({s:(k+R())/170,j:N(0,.8),c:white?[255,246,205]:pk(GOLD,R(),.5),rad:R()<.4?1:.5,ph:R()*6.28})}
 for(let k=0;k<70;k++){const u=areaU(),v=sampleV(.16);
  bud.push({u:u,v:v,c:u<.25?pk(GOLD,R(),.5):(Math.abs(v)>.8&&R()<.4?[255,255,255]:[255*(.93+.07*R()),252*(.93+.07*R()),240*(.9+.1*R())]),rad:R()<.6?1:.5,ph:R()*6.28})}
 TEND.push({dir:dir,bx:U(-.2,.2),Rc:U(.12,.2),cyc:U(.6,1),turns:U(1.1,1.7),sw:U(-.06,.06),th:.3+j*.07,ph:R()*6.28,pts:pts,bud:bud})}
const CEN=[];for(let k=0;k<700;k++){const a=U(0,2*PI),r=Math.sqrt(R())*.22,gd=R()<.22;CEN.push({a:a,r:r,c:gd?[255,205,80]:pk([[110,35,8],[160,60,12],[205,95,20]],R(),.6),rad:gd?.5:1})}
function tp(T,s,t){const sc=.55;let x,y;
 if(s<sc){const f=s/sc,e=f*f*(3-2*f);x=T.bx+Math.sin(f*PI)*T.sw+Math.sin(t*1.3+T.ph)*.012*f;y=.05+(T.cyc-.05)*e}
 else{const g=(s-sc)/(1-sc),phi=(T.dir>0?0:PI)+T.dir*g*T.turns*2*PI,r=T.Rc*(1-.88*Math.pow(g,.85)),cx0=T.bx-T.dir*T.Rc+Math.sin(t*1.3+T.ph)*.012;
  x=cx0+r*Math.cos(phi);y=T.cyc+r*Math.sin(phi)}
 return[x,y]}

// ---- batch
const CAP=60000,bx=new Float32Array(CAP),by=new Float32Array(CAP),bz=new Float32Array(CAP),bc=new Float32Array(CAP*3),br_=new Float32Array(CAP);
let bn=0;const cnt=new Int32Array(5002),ord=new Int32Array(CAP);
function add(x,y,r,g,b,rad,z){if(bn>=CAP)return;bx[bn]=x;by[bn]=y;bz[bn]=z;br_[bn]=rad;bc[bn*3]=r;bc[bn*3+1]=g;bc[bn*3+2]=b;bn++}
function flush(buf){cnt.fill(0);for(let i=0;i<bn;i++)cnt[cl(Math.round(bz[i]),-2500,2500)+2501]++;
 for(let i=1;i<5002;i++)cnt[i]+=cnt[i-1];
 for(let i=0;i<bn;i++){ord[cnt[cl(Math.round(bz[i]),-2500,2500)+2500]++]=i}
 for(let k=0;k<bn;k++){const i=ord[k];sp(buf,bx[i],by[i],bc[i*3],bc[i*3+1],bc[i*3+2],br_[i])}bn=0}

function ctrl(L,w,sway){return[[cx,y0+4],[cx+.2*L*(1-w)+.02*L*w,y0-.33*L],[cx-.12*L*(1-w)+.08*L*w+sway*.5,y0-L*(.74+.3*w)],[cx+sway+.32*L*w,y0-L*(1-.15*w)]]}
let Bx,By,Bdx,Bdy;
function bez(P,s){const q=1-s,a=P[0],b=P[1],c=P[2],d=P[3];
 Bx=q*q*q*a[0]+3*q*q*s*b[0]+3*q*s*s*c[0]+s*s*s*d[0];By=q*q*q*a[1]+3*q*q*s*b[1]+3*q*s*s*c[1]+s*s*s*d[1];
 Bdx=3*q*q*(b[0]-a[0])+6*q*s*(c[0]-b[0])+3*s*s*(d[0]-c[0]);Bdy=3*q*q*(b[1]-a[1])+6*q*s*(c[1]-b[1])+3*s*s*(d[1]-c[1])}

const frame=new Uint8ClampedArray(W*H*4),cv=document.getElementById("c"),ctx=cv.getContext("2d"),img=new ImageData(frame,W,H);

function render(t){
 const st=state(t),stem=st[0],size=st[1],bloom=st[2],wilt=st[3],leaf=st[4],glow=st[5];
 frame.set(base);bn=0;
 const L=Ls*stem,sway=.012*H*Math.sin(t*.9)*stem*(1-.6*wilt),P=ctrl(L,wilt,sway),hx=P[3][0],hy=P[3][1];
 {const g=stem*1.08,wf=1-.3*wilt;for(let i=0;i<ROOTS.length;i++){const p=ROOTS[i];if(p.d>g)continue;const tip=cl(1-(g-p.d)*9,0,1),b=(p.b*(.8+.2*Math.sin(t*3+p.d*25))+tip*.5)*wf;add(p.x,p.y,255*b,252*b,255*b,p.rad,-600)}}
 if(stem>.01){const nv=Math.floor(stemP.length*cl(stem,.08,1));
  for(let i=0;i<nv;i++){const p=stemP[i];bez(P,p.s);const nn=Math.hypot(Bdx,Bdy)+1e-6,
   wst=.011*H*(1-.3*p.s)*(1-.25*wilt)*cl(.4+stem*1.2,.4,1),lat=p.lat*wst,wi=cl(wilt*(.75+.5*p.s)*(.7+.5*p.rn),0,1),a=p.live,b=p.wilt;
   add(Bx-Bdy/nn*lat,By+Bdx/nn*lat,a[0]+(b[0]-a[0])*wi,a[1]+(b[1]-a[1])*wi,a[2]+(b[2]-a[2])*wi,p.rad,-500)}}
 if(leaf>.02&&stem>.05){const nv=Math.floor(leafP.length*cl(leaf,.15,1)),ax=[],ay=[];
  for(let j=0;j<7;j++){bez(P,LEAFD[j][0]);ax.push(Bx);ay.push(By)}
  for(let i=0;i<nv;i++){const p=leafP[i],j=p.lid,d=LEAFD[j],m=d[1],a0=d[3]+(1-leaf)*.8-.6*wilt,c=d[4]-.5*wilt,u=p.u,v=p.v,
   LL=.19*H*d[2]*leaf*(1-.25*wilt),am=a0+c*u*.5,al=a0+c*u,sc=sinc(c*u*.5),lat=v*.33*LL*prof(u),
   X=ax[j]+LL*u*m*Math.cos(am)*sc-lat*Math.sin(al),Yup=LL*u*Math.sin(am)*sc+lat*m*Math.cos(al),
   wi=cl(wilt*(.9+.5*u+.3*p.rn)-.1,0,1),a=p.live,b=p.wilt;
   add(X,ay[j]-Yup,a[0]+(b[0]-a[0])*wi,a[1]+(b[1]-a[1])*wi,a[2]+(b[2]-a[2])*wi,p.rad,-450)}}
 if(stem>.01&&size>.05){
  const phi=wilt*2.75+.035*Math.sin(t*.9+1)*(1-wilt),tau=.2+.36*bloom-.4*wilt,cp=Math.cos(phi),spp=Math.sin(phi),ct=Math.cos(tau),stt=Math.sin(tau),Ls_=Lf*size;
  let ZP,YP;const proj=(xl,yl,zl)=>{const yp=yl*ct-zl*stt;ZP=yl*stt+zl*ct;return[hx+xl*cp+yp*spp,hy-(-xl*spp+yp*cp)]};
  const vis=cl(size*size*1.15,.2,1),nv=Math.floor(headP.length*vis);
  for(let i=0;i<nv;i++){const g=headP[i],q=g.P,Ly=q.Ly,u=g.u,v=g.v;
   let A0=Ly.ac+(Ly.ao-Ly.ac)*bloom+q.aj;A0=A0*(1-.55*wilt)+wilt*q.wj*.3;
   const K=Ly.kc+(Ly.ko-Ly.kc)*bloom+wilt*(.6+.6*q.pj),Lp=Ls_*Ly.L*q.lj*(1-.28*wilt*q.pj),am=A0+K*u*.5,sc=sinc(K*u*.5);
   let rr=Lp*u*Math.sin(am)*sc;const hh=Lp*u*Math.cos(am)*sc,lat=v*(Ly.wc+(Ly.wo-Ly.wc)*bloom)*Lp*g.sp*(1+.08*Math.sin(u*15+q.th*3));
   rr=rr+.025*Ls_-.5*lat*lat/(Lp+1);const cth=Math.cos(q.th),sth=Math.sin(q.th),xy=proj(cth*rr-sth*lat,hh,sth*rr+cth*lat);
   const shade=cl(.72+.28*cl(ZP/Ls_*.5+.5,0,1)+.12*(hh/Ls_),.5,1.2),wi=cl(wilt*(1+.7*u+.4*g.rn)-.2,0,1),a=g.live,b=g.wilt;
   add(xy[0],xy[1],(a[0]+(b[0]-a[0])*wi)*shade,(a[1]+(b[1]-a[1])*wi)*shade,(a[2]+(b[2]-a[2])*wi)*shade,g.rad,ZP)}
  if(glow>.02){const gx=hx+spp*.5*Ls_,gy=hy-cp*.5*Ls_,Rg=Ls_*2.3,xa=Math.max(0,Math.floor(gx-Rg)),xb=Math.min(W,Math.ceil(gx+Rg)),ya=Math.max(0,Math.floor(gy-Rg)),yb=Math.min(H,Math.ceil(gy+Rg)),k0=glow*(.8+.2*Math.sin(t*2.2))*(1-.7*wilt);
   for(let yy=ya;yy<yb;yy++)for(let xx=xa;xx<xb;xx++){const d=Math.sqrt((xx-gx)*(xx-gx)+(yy-gy)*(yy-gy))/Rg;if(d>=1)continue;const f=(1-d)*(1-d)*k0,i=(yy*W+xx)*4;frame[i]+=95*f;frame[i+1]+=58*f;frame[i+2]+=10*f}}
  for(let i=0;i<CEN.length;i++){const q=CEN[i],xy=proj(Math.cos(q.a)*q.r*Ls_,.02*Ls_,Math.sin(q.a)*q.r*Ls_),c=q.c,br=1-.5*wilt;add(xy[0],xy[1],c[0]*br,c[1]*br,c[2]*br,q.rad,ZP+1)}
  const ss=sstep(bloom,.3,.85);
  if(ss>.02){const nv2=Math.floor(stamP.length*cl(size*size,.25,1));
   for(let i=0;i<nv2;i++){const g=stamP[i],f=g.f,ell=Ls_*ss*f.ell,beta=f.beta*(.6+.4*bloom)+wilt*.3,r=ell*g.t*Math.sin(beta)+.02*Ls_,yl=.05*Ls_+ell*g.t*Math.cos(beta),
    xy=proj(Math.cos(f.th)*r,yl,Math.sin(f.th)*r),a=g.live,b=g.wilt;
    add(xy[0],xy[1],a[0]+(b[0]-a[0])*wilt,a[1]+(b[1]-a[1])*wilt,a[2]+(b[2]-a[2])*wilt,g.rad,ZP+3)}}
  for(let j=0;j<TEND.length;j++){const T=TEND[j],g1=sstep(bloom,T.th,T.th+.3)*(1-.85*sstep(wilt,0,.6));if(g1<.02)continue;
   const wl=wilt*.7,tt=Ls_*(1-.3*wilt);
   for(let k=0;k<T.pts.length;k++){const q=T.pts[k];if(q.s>g1)continue;
    const pp=tp(T,q.s,t),xy=proj(pp[0]*tt+q.j,pp[1]*tt,.02*Ls_),c=q.c,br=(.75+.25*Math.sin(t*4+q.ph))*(.7+.5*q.s);
    add(xy[0],xy[1],(c[0]+(170-c[0])*wl)*br,(c[1]+(140-c[1])*wl)*br,(c[2]+(100-c[2])*wl)*br,q.rad,ZP+4)}
   const bsz=sstep(g1,.93,1);
   if(bsz>.02){const p0=tp(T,.97,t),p1=tp(T,1,t),dx=p1[0]-p0[0],dy=p1[1]-p0[1],nn=Math.hypot(dx,dy)+1e-6,ax=dx/nn,ay=dy/nn,Lb=.11*tt*bsz,wb=Lb*.42;
    for(let k=0;k<T.bud.length;k++){const q=T.bud[k],lat=q.v*wb*prof(q.u),
     lx=p1[0]*tt+ax*Lb*q.u-ay*lat,ly=p1[1]*tt+ay*Lb*q.u+ax*lat,xy=proj(lx,ly,.02*Ls_),c=q.c,tw=.9+.1*Math.sin(t*3+q.ph);
     add(xy[0],xy[1],(c[0]+(170-c[0])*wl)*tw,(c[1]+(140-c[1])*wl)*tw,(c[2]+(100-c[2])*wl)*tw,q.rad,ZP+5)}}}
  const fw=1-sstep(wilt,0,.5);
  if(fw>.02){const scx=hx+spp*.5*Ls_,scy=hy-cp*.5*Ls_;
   for(let k=0;k<WISPS.length;k++){const Wp=WISPS[k],age=t-Wp.t0;if(age<0||age>5.6)continue;
    const x0=Math.min(age/2.6,1),gh=1-Math.pow(1-x0,2),gt=cl((age-3.2)/2.2,0,1),fo=1-sstep(age,4.4,5.6),
     Cx=scx+Wp.ox*Ls_+Wp.dir*Ls_*.05*age,Cy=scy+Wp.oy*Ls_-Ls_*.1*age,D=Math.hypot(Cx-scx,Cy-scy),th0=Math.atan2(scy-Cy,scx-Cx),c=Wp.c;
    for(let i=0;i<Wp.pts.length;i++){const p=Wp.pts[i],s=p.s;if(s>gh||s<gt)continue;
     const th=th0+Wp.dir*Wp.turns*2*PI*Math.pow(s,.9),rr=D*Math.pow(1-s,1.5)+p.j,
      hd=Math.exp(-(gh-s)*3.5),w=Math.exp(-(gh-s)*12)*.8,bb=fw*fo*(.3+.7*hd)*(.7+.3*Math.sin(age*14+p.ph));
     add(Cx+Math.cos(th)*rr,Cy+Math.sin(th)*rr,(c[0]*(1-w)+255*w)*bb,(c[1]*(1-w)+255*w)*bb,(c[2]*(1-w)+255*w)*bb,p.r,1700)}
    if(gh>.9){const bs=fw*fo*(.6+.4*Math.sin(age*9));add(Cx,Cy,255*bs,225*bs,130*bs,2,1800)}}}
  if(glow>.02){const ccx=hx+spp*.5*Ls_,ccy=hy-cp*.5*Ls_,nh=Math.floor(halo.length*glow);
   for(let i=0;i<nh;i++){const h=halo[i],rh=h.r*Ls_*1.1,b=h.b*glow*(.85+.3*Math.sin(t*1.3+h.fl*6.28));
    add(ccx+Math.cos(h.a)*rh,ccy+Math.sin(h.a)*rh,255*b,175*b,40*b,1,-2000)}
   const nr=Math.floor(ring.length*glow),Rs=Ls_*1.25;
   for(let i=0;i<nr;i++){const o=ring[i],ca=2*PI*o.cj/6+t*.15,a=o.a+t*.05,bb=(.4+.6*glow)*(.65+.35*Math.sin(t*2+o.fl*20));
    add(ccx+Rs*(o.cf*Math.cos(ca)+o.rho*Math.cos(a)),ccy+Rs*(o.cf*Math.sin(ca)+o.rho*Math.sin(a)),255*bb,200*bb,80*bb,1,-1500)}
   for(let i=0;i<spark.length;i++){const s=spark[i],life=(t*.1*s.sp+s.ph)%1,rho=(.25+1.15*s.rho)*Ls_*(.6+.6*life),bs=Math.pow(Math.sin(PI*life),.8)*glow,c=s.hue<.5?[255,240,170]:[255,185,60];
    add(ccx+Math.cos(s.a)*rho,ccy+Math.sin(s.a)*rho-life*.25*Ls_,c[0]*bs,c[1]*bs,c[2]*bs,s.rad,2000)}
   flush(frame);
   for(let j=0;j<6;j++){const ja=2*PI*j/6+t*.15;sp(frame,ccx+Rs*Math.cos(ja),ccy+Rs*Math.sin(ja),255*glow,230*glow,140*glow,3)}}
  if(wilt>.02){for(let i=0;i<fall.length;i++){const F=fall[i],f=cl((wilt*1.05-F.r0*.7)/.35,0,1);if(f<=0)continue;
   const sx=hx+F.ox*.18*Ls_,sy=hy+F.oy*.18*Ls_+.25*Ls_,x=sx+(F.xl-sx)*f+Math.sin(f*6.28+F.ph)*.03*H*(1-f),y=sy+(F.yl-sy)*f*f;
   add(x,y,F.c[0],F.c[1],F.c[2],F.rad,500)}}}
 flush(frame);
 for(let i=0;i<crumbs.length;i++){const c=crumbs[i],e=cl((t-c.dl)/3,0,1);sp(frame,c.x,c.y-c.amp*Math.sin(PI*e),c.c[0],c.c[1],c.c[2],c.rad)}
 ctx.putImageData(img,0,0)}

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let t0=performance.now();
function loop(now){let t=(now-t0)/1000/TS;if(t>T_END+4){t0=now;t=0}render(t);requestAnimationFrame(loop)}
if(reduce)render(10);else requestAnimationFrame(loop);
document.body.addEventListener("click",function(){t0=performance.now();if(reduce)render(10)});
